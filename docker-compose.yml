version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: algovault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: algovault
      POSTGRES_USER: algovault
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-algovaultpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algovault -d algovault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algovault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algovault-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/algovault
      SPRING_DATASOURCE_USERNAME: algovault
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-algovaultpass}
      SPRING_REDIS_HOST: redis
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-Ov23liTftGjfEU3BuSwX}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-77d4d5e03d71a049bd6992accdebecb6cc94238b}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeythatisatleast32characterslong12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-chrome-extension://nglebofiomebgndkkdecnmolafjdphhf}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
